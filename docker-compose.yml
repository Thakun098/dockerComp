services:
 Database:
   container_name: postgres
   image: postgres
   environment:
     POSTGRES_USER: postgres
     POSTGRES_PASSWORD: 1234

   ports:
     - "5432:5432"
   networks:
     - mynetwork

pgAdmin:
   container_name: pgAdmin
   image: dpage/pgadmin4
   environment:
    - PGADMIN_DEFAULT_EMAIL: example@domain.com
    - PGADMIN_DEFAULT_PASSWORD: 1234
   
   ports:
     - "8080:80"
   networks:
     - mynetwork

networks:
 mynetwork:
   driver: bridge

